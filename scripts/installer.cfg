# jpackage arguments for the per-user Windows installer (referenced from the pom's
# installer profile: jpackage @scripts/installer.cfg). The runtime image is bundled by
# default - no JDK on the user's machine. The demo library ships in the app jar.
--type msi
--name AgenticResearchBuddy
--description "Agentic Research Buddy - conversational data-analysis studio"
--vendor research-buddy
--app-version 0.1.0
--win-per-user-install
--win-menu
--win-shortcut
--input target/package
--main-jar research-buddy.jar
--main-class ui.StudioShell
--dest target/installer
