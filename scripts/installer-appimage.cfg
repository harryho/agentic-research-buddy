# Fallback packaged form: the application image (bundled runtime, launcher exe, no MSI).
# Same app as the MSI config - the MSI leg on the build machine is blocked by the WiX
# extension install (the configured nuget source serves no WixToolset packages); on a
# clean machine with default nuget.org: wix extension add -g WixToolset.Util.wixext,
# then build with scripts/installer.cfg.
--type app-image
--name AgenticResearchBuddy
--description "Agentic Research Buddy - conversational data-analysis studio"
--vendor research-buddy
--app-version 0.1.0
--input target/package
--main-jar research-buddy.jar
--main-class ui.StudioShell
--dest target/installer
